name: Deploy to Nautilus

# Every push to the bot's branch copies the latest code straight to the
# production server and restarts both bots — the same thing the bot's own
# /update command does, just triggered by git instead of a Telegram
# message, so a deploy never needs anyone to open Telegram at all.
#
# Needs four repository secrets (Settings -> Secrets and variables ->
# Actions -> New repository secret), set once:
#   NAUTILUS_HOST      server IP
#   NAUTILUS_PORT      SSH port (22 unless it's been changed)
#   NAUTILUS_USER      SSH username
#   NAUTILUS_PASSWORD  SSH password
on:
  push:
    branches:
      - claude/iran-vpn-turkey-d2hbvg
    paths:
      - "hermes-vpn-bot/**"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy files to Nautilus
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.NAUTILUS_HOST }}
          port: ${{ secrets.NAUTILUS_PORT }}
          username: ${{ secrets.NAUTILUS_USER }}
          password: ${{ secrets.NAUTILUS_PASSWORD }}
          source: "hermes-vpn-bot"
          target: "/tmp/hermes-deploy"

      - name: Install and restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.NAUTILUS_HOST }}
          port: ${{ secrets.NAUTILUS_PORT }}
          username: ${{ secrets.NAUTILUS_USER }}
          password: ${{ secrets.NAUTILUS_PASSWORD }}
          envs: CARD_NUMBER,CARD_OWNER
          script: |
            set -e
            APP=$(sudo ls -d /opt/irannewvpn-bot /opt/hermes-vpn-bot 2>/dev/null | head -1)
            if [ -z "$APP" ]; then
              echo "no install directory found under /opt"
              exit 1
            fi
            SVC=$(basename "$APP")
            sudo cp -r /tmp/hermes-deploy/hermes-vpn-bot/bot/. "$APP/bot/"
            sudo cp -r /tmp/hermes-deploy/hermes-vpn-bot/server/. "$APP/server/" 2>/dev/null || true
            rm -rf /tmp/hermes-deploy
            PIP="$APP/venv/bin/pip"
            if sudo test -x "$PIP"; then
              sudo "$PIP" install -q -r "$APP/bot/requirements.txt"
            fi
            ENVF="$APP/bot/.env"
            set_env() {
              KEY="$1"; VAL="$2"
              if sudo grep -q "^${KEY}=" "$ENVF" 2>/dev/null; then
                sudo sed -i "s|^${KEY}=.*|${KEY}=${VAL}|" "$ENVF"
              else
                echo "${KEY}=${VAL}" | sudo tee -a "$ENVF" >/dev/null
              fi
            }
            set_env XUI_INBOUND_ID 2
            set_env CARD_NUMBER "$CARD_NUMBER"
            set_env CARD_OWNER "$CARD_OWNER"
            sudo systemctl restart "$SVC"
            sudo systemctl restart "$SVC-dev" 2>/dev/null || true
            echo "deployed and restarted $SVC (+ $SVC-dev if present)"
