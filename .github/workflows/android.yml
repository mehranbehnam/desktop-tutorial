# Builds the Android APK.
#
# The Android SDK cannot be installed in every development environment (the
# Google download hosts are blocked on some networks), while GitHub's Ubuntu
# runners ship it preinstalled — so this workflow is the reliable way to get
# an installable APK without setting up Android Studio locally.
#
# Download the result from the run's "Artifacts" section.

name: android

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Needed to publish the APK as a release asset.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        # Both are optional: with no secrets set, the app asks for api_id and
        # api_hash on first launch instead of baking them into the APK.
        env:
          VITE_TG_API_ID: ${{ secrets.TG_API_ID }}
          VITE_TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install SDK packages
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null 2>&1 || true
          "$sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Sync web assets into the Android project
        run: npx cap sync android

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: lilika-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # An artifact downloads as a zip, which a phone cannot install. A release
      # asset is the raw file, so this rolling release gives a stable URL that
      # Android can open directly.
      - name: Publish APK to the rolling release
        if: github.ref_name == 'claude/telegram-messenger-platform-sv8vfg' || github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk lilika-debug.apk
          # Replace the previous release so the download URL never changes.
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest lilika-debug.apk \
            --title 'LiLika — debug APK' \
            --notes "Debug build of ${GITHUB_SHA:0:7} on $(date -u +%Y-%m-%d). Debug-signed: enable install from unknown sources." \
            --prerelease \
            --target "$GITHUB_SHA"
