name: Build Android APK (iranvpn_app)

# Builds the Flutter app's Android APK on GitHub's own runners — this repo's
# dev sandbox has no path to the Android SDK (its egress policy blocks
# dl.google.com), so GitHub Actions is where a real installable APK
# actually gets produced. The APK is debug-signed (this app has no release
# keystore yet) — fine for sideloading during testing, not for a Play
# Store release.
on:
  push:
    branches:
      - claude/iran-vpn-turkey-d2hbvg
    paths:
      - "iranvpn_app/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iranvpn_app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: "stable"

      - run: flutter pub get
      - run: flutter analyze
      # Split per ABI: the bundled Xray native library ships a .so per
      # architecture, so one universal APK carries all of them — split
      # cuts each download to roughly a third of that, which matters a
      # lot on a slow/throttled connection.
      - run: flutter build apk --release --split-per-abi

      - name: Rename APKs with build number
        run: |
          out=build/app/outputs/flutter-apk
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "$out/app-$abi-release.apk" "$out/iranvpn-${{ github.run_number }}-$abi.apk"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: iranvpn-android-${{ github.run_number }}
          path: iranvpn_app/build/app/outputs/flutter-apk/iranvpn-${{ github.run_number }}-*.apk

      - name: Publish/refresh the "android-preview" release with this build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-preview
          name: "IranVPN Android preview (build ${{ github.run_number }})"
          body: |
            Auto-built from commit ${{ github.sha }} — debug-signed, for sideload testing only.
            No VPN core license/Play Store distribution implied.

            Most phones (2019+): iranvpn-*-arm64-v8a.apk
            Older/32-bit phones: iranvpn-*-armeabi-v7a.apk
            Emulator/x86_64: iranvpn-*-x86_64.apk
          prerelease: true
          files: iranvpn_app/build/app/outputs/flutter-apk/iranvpn-${{ github.run_number }}-*.apk

      # Every "دانلود نرم‌افزار" button the bot/redirect page sends out
      # points at this one stable URL. Refresh it with this build's arm64
      # APK (the ABI virtually every phone needs) so the file customers
      # download always matches the deep-link support the bots expect —
      # a stale copy here previously meant the "باز کردن در نرم‌افزار"
      # button did nothing because no installed app claimed the scheme.
      - name: Flatten the arm64 APK for upload
        run: cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk HermesVPN-Connect.apk

      - name: Upload it to the redirect server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.NAUTILUS_HOST }}
          port: ${{ secrets.NAUTILUS_PORT }}
          username: ${{ secrets.NAUTILUS_USER }}
          password: ${{ secrets.NAUTILUS_PASSWORD }}
          source: "iranvpn_app/HermesVPN-Connect.apk"
          target: "/tmp"
          strip_components: 1

      - name: Move the uploaded APK into place
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.NAUTILUS_HOST }}
          port: ${{ secrets.NAUTILUS_PORT }}
          username: ${{ secrets.NAUTILUS_USER }}
          password: ${{ secrets.NAUTILUS_PASSWORD }}
          script: |
            set -e
            sudo mv /tmp/HermesVPN-Connect.apk /var/www/connect/HermesVPN-Connect.apk
            sudo chmod 644 /var/www/connect/HermesVPN-Connect.apk
            echo "refreshed /var/www/connect/HermesVPN-Connect.apk"
