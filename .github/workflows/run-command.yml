name: Run command on Nautilus

on:
  push:
    paths:
      - ".github/workflows/run-command.yml"
  workflow_dispatch:
    inputs:
      command:
        description: "Shell command to run on the server (as root)"
        required: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Run on Nautilus
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.NAUTILUS_HOST }}
          port: ${{ secrets.NAUTILUS_PORT }}
          username: ${{ secrets.NAUTILUS_USER }}
          password: ${{ secrets.NAUTILUS_PASSWORD }}
          script: |
            APP=$(sudo ls -d /opt/irannewvpn-bot /opt/hermes-vpn-bot 2>/dev/null | head -1)
            sudo grep -E '^XUI_BASE_URL=|^XUI_USERNAME=|^XUI_API_TOKEN=' "$APP/bot/.env" | sed 's/^XUI_API_TOKEN=.*/XUI_API_TOKEN=<set, hidden>/'
